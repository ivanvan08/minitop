<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Архітектура minitop: ядро, локальні шари, мережеві шари">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="470" fill="#0d1117"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#c9d1d9" stroke="#8b949e">
    <!-- джерела даних -->
    <rect x="30" y="20" width="180" height="44" rx="8" fill="none"/>
    <text x="120" y="47" text-anchor="middle" stroke="none">/proc</text>
    <rect x="240" y="20" width="180" height="44" rx="8" fill="none"/>
    <text x="330" y="47" text-anchor="middle" stroke="none">/sys</text>
    <rect x="450" y="20" width="240" height="44" rx="8" fill="none"/>
    <text x="570" y="47" text-anchor="middle" stroke="none">локальна база pacman</text>

    <line x1="120" y1="64" x2="120" y2="104" marker-end="url(#a)"/>
    <line x1="330" y1="64" x2="330" y2="104" marker-end="url(#a)"/>
    <line x1="570" y1="64" x2="570" y2="104" marker-end="url(#a)"/>

    <!-- ядро -->
    <rect x="30" y="110" width="660" height="86" rx="10" fill="none" stroke-width="1.6"/>
    <text x="360" y="140" text-anchor="middle" stroke="none" font-weight="600" fill="#e6edf3">ядро</text>
    <text x="360" y="162" text-anchor="middle" stroke="none">sysinfo · procs · config · input</text>
    <text x="360" y="182" text-anchor="middle" stroke="none">tui: шапка, таблиця, рядок стану</text>

    <!-- права колонка: режим -->
    <rect x="720" y="110" width="150" height="86" rx="10" fill="none" stroke-dasharray="5 4"/>
    <text x="795" y="140" text-anchor="middle" stroke="none">режим</text>
    <text x="795" y="160" text-anchor="middle" stroke="none">1: ядро</text>
    <text x="795" y="178" text-anchor="middle" stroke="none">2-3: + шари</text>

    <line x1="225" y1="196" x2="225" y2="238" marker-end="url(#a)"/>
    <line x1="225" y1="216" x2="660" y2="216" stroke-dasharray="2 0" opacity="0"/>
    <line x1="420" y1="292" x2="446" y2="292" marker-end="url(#a)"/>

    <!-- локальні шари -->
    <rect x="30" y="244" width="390" height="96" rx="10" fill="none"/>
    <text x="225" y="272" text-anchor="middle" stroke="none" font-weight="600" fill="#3fb950">локальні шари</text>
    <text x="225" y="294" text-anchor="middle" stroke="none">flags: DEL · TMP · MEMFD · NET</text>
    <text x="225" y="314" text-anchor="middle" stroke="none">trust: C · E · H, гейт argv/uid</text>

    <!-- мережеві шари -->
    <rect x="450" y="244" width="420" height="96" rx="10" fill="none" stroke-dasharray="6 4"/>
    <text x="660" y="272" text-anchor="middle" stroke="none" font-weight="600" fill="#58a6ff">мережеві шари (режими 2-3)</text>
    <text x="660" y="294" text-anchor="middle" stroke="none">model: HTTP -&gt; рівень 1..10</text>
    <text x="660" y="314" text-anchor="middle" stroke="none">llm: HTTP -&gt; вердикт 0/1 для невпевненої смуги</text>
    <text x="660" y="332" text-anchor="middle" stroke="none" font-size="11">libcurl підвантажується через dlopen лише тут</text>


    <!-- результат -->
    <rect x="30" y="384" width="840" height="56" rx="10" fill="none"/>
    <text x="450" y="408" text-anchor="middle" stroke="none">клітинка FLAGS</text>
    <text x="450" y="428" text-anchor="middle" stroke="none">прапорці (режим 1) або бал і колір вердикту (режими 2-3)</text>
    <line x1="225" y1="340" x2="225" y2="378" marker-end="url(#a)"/>
    <line x1="660" y1="340" x2="660" y2="378" marker-end="url(#a)"/>



    <text x="30" y="462" stroke="none" font-size="11">суцільна рамка - завжди; пунктир - лише коли ввімкнено модель</text>
  </g>
</svg>
